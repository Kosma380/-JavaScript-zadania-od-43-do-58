<h2 style="color: blue;">Kosma Sirocki 3F - Zadanie 13</h2>
<div style="color:red; font-size:40px;">
<script language="JavaScript">
// Kosma Sirocki 3F
// Zadanie 13 – zamiana sekund na godziny
var sekundy = parseFloat(prompt("Podaj liczbę sekund:", ""));
var godziny = sekundy / 3600;
document.write(sekundy + " sekund = " + godziny.toFixed(2) + " godzin<br>");
</script>
</div>
<hr>
<p><b>Teoria:</b><br>
Program przelicza sekundy na godziny, dzieląc je przez 3600.
</p>
