<html>  
<head>  
<title> zadanie 22</title> 
<script type="text/javascript">
  function Pole_sirocki(a_sir, b_sir) {
    return a_sir * b_sir;
  }
  function obwod_sirocki(a_sir, b_sir) {
    return 2 * (a_sir + b_sir);
  }
  function pole() {
    var a_sir = parseFloat(document.getElementById('a_dana_sir').value);
    var b_sir = parseFloat(document.getElementById('b_dana_sir').value);
    var pole = Pole_sirocki(a_sir, b_sir);
    document.getElementById("nazwa").innerHTML = "Pole prostokąta = " + pole.toFixed(2) + " cm²";
    document.getElementById('wyprowadz_pole_sir').value = pole.toFixed(2);
  }
  function obwod() {
    var a_sir = parseFloat(document.getElementById('a_dana_sir').value);
    var b_sir = parseFloat(document.getElementById('b_dana_sir').value);
    var obw = obwod_sirocki(a_sir, b_sir);
    document.getElementById("nazwa").innerHTML = "Obwód prostokąta = " + obw.toFixed(2) + " cm";
    document.getElementById('wyprowadz_obwod_sir').value = obw.toFixed(2);
  }
</script>
  <h1>Wszystko o PROSTOKĄCIE</h1><br><br>
  Podaj długość a: <input type="text" id="a_dana_sir" value=""> cm<br><br>
  Podaj długość b: <input type="text" id="b_dana_sir" value=""> cm<br><br>
  <input type="button" name="pole" value="Oblicz pole" onclick="pole()"><br><br>
  <input type="button" name="obw" value="Oblicz obwód" onclick="obwod()"><br><br>
  <div style="color:red;font-size:50px;" id="nazwa"></div>
  <br>
</body>
</html>
