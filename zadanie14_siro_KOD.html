<script language="JavaScript">

// Zadanie 14 – kwadrat i sześcian liczby

var szescian = Math.pow(x, 3);
document.write("Liczba: " + x + "<br>");
document.write("Kwadrat: " + kwadrat + "<br>");
document.write("Sześcian: " + szescian + "<br>");
</script>
