<!DOCTYPE html>
<html>
<head>
<title>Kosma Sirocki - Zadanie 8</title>
<meta charset="utf-8">
<script type="text/javascript">
    function okno_zamknij_siro() { window.close(); }
function show_confirm() {
    var r = confirm("Naciśnij klawisz");
    if (r == true) {
        document.write("Nacisnąłeś OK!");
    } else {
        document.write("Nacisnąłeś Cancel!");
    }
}
</script>
</head>
<body>
<h2 style="color: blue;">Kosma Sirocki 3F - Zadanie 8</h2>
<input type="button" onclick="show_confirm()" value="Pokaż Confirm Box">
<hr>
<p><b>Teoria:</b><br>
Confirm Box służy do uzyskania potwierdzenia od użytkownika. 
Zwraca <b>true</b>, jeśli użytkownik kliknie <i>OK</i>, oraz <b>false</b>, jeśli wybierze <i>Cancel</i>.
</p>
<input type="button" value="Zamknij okno" onclick="okno_zamknij_siro()">
</body>
</html>
