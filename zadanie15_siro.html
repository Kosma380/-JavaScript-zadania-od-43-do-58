<body>
<h2 style="color: blue;">Kosma Sirocki 3F - Zadanie 15</h2>
<div style="color:red; font-size:40px;">
<script language="JavaScript">
// Kosma Sirocki 3F
// Zadanie 15 – pole i obwód prostokąta
var a = parseFloat(prompt("Podaj bok a:", ""));
var b = parseFloat(prompt("Podaj bok b:", ""));
var pole = a * b;
var obwod = 2 * (a + b);
document.write("Pole = " + pole + "<br>");
document.write("Obwód = " + obwod + "<br>");
</script>
</div>
<hr>
<p><b>Teoria:</b><br>
Pole prostokąta: <code>P = a × b</code><br>
Obwód prostokąta: <code>Ob = 2 × (a + b)</code>
</p>
