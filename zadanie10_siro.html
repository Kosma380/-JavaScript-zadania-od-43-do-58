<body>
<h2 style="color: blue;">Kosma Sirocki 3F - Zadanie 10</h2>
<div style="color:red; font-size:40px;">
<script language="JavaScript">
// Kosma Sirocki 3F
// Zadanie 10
var liczba1 = prompt("Podaj pierwszą liczbę:", "");
var liczba2 = prompt("Podaj drugą liczbę:", "");
var a = parseFloat(liczba1);
var b = parseFloat(liczba2);
var suma = a + b;
document.write("Suma = " + a + " + " + b + " = " + suma + "<br>");
</script>
</div>
<hr>
<p><b>Teoria:</b><br>
Program wczytuje dwie liczby od użytkownika, konwertuje je na liczby rzeczywiste przy użyciu 
<code>parseFloat()</code> i oblicza ich sumę.
</p>
<input type="button" value="Zamknij okno" onclick="okno_zamknij_siro()">
</body>
