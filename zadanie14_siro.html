<!DOCTYPE html>
<html>
<head>
<title>Kosma Sirocki - Zadanie 14</title>
 <script type="text/javascript">
    function okno_zamknij_siro() { window.close(); }
  </script>
<meta charset="utf-8">
</head>
<body>
<h2 style="color: blue;">Kosma Sirocki 3F - Zadanie 14</h2>
<div style="color:red; font-size:40px;">
<script language="JavaScript">
// Kosma Sirocki 3F
// Zadanie 14 – kwadrat i sześcian liczby
var x = parseFloat(prompt("Podaj liczbę:", ""));
var kwadrat = Math.pow(x, 2);
var szescian = Math.pow(x, 3);
document.write("Liczba: " + x + "<br>");
document.write("Kwadrat: " + kwadrat + "<br>");
document.write("Sześcian: " + szescian + "<br>");
</script>
</div>
<hr>
<p><b>Teoria:</b><br>
Do potęgowania w JavaScript używamy funkcji <code>Math.pow()</code>.
</p>
<input type="button" value="Zamknij okno" onclick="okno_zamknij_siro()">
</body>
</body>
</html>
