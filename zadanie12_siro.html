<h2 style="color: blue;">Kosma Sirocki 3F - Zadanie 12</h2>
<div style="color:red; font-size:40px;">
<script language="JavaScript">
// Kosma Sirocki 3F
// Zadanie 12 – zamiana dni na sekundy
var dni = parseFloat(prompt("Podaj liczbę dni:", ""));
var sekundy = dni * 24 * 60 * 60;
document.write(dni + " dni = " + sekundy + " sekund<br>");
</script>

<hr>
<p><b>Teoria:</b><br>
1 dzień = 24 godziny × 60 minut × 60 sekund = 86 400 sekund.
</p>
